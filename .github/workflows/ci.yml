name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assetguard
          POSTGRES_USER: assetguard
          POSTGRES_PASSWORD: assetguard-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetguard -d assetguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASSETGUARD_DATABASE_URL: postgresql+psycopg://assetguard:assetguard-ci-password@127.0.0.1:5432/assetguard
      ASSETGUARD_INVENTORY_SHARED_SECRET: ci-inventory-secret
      ASSETGUARD_ADMIN_SHARED_SECRET: ci-admin-secret
      ASSETGUARD_VIEWER_SHARED_SECRET: ci-viewer-secret
      ASSETGUARD_POSTGRES_DB: assetguard
      ASSETGUARD_POSTGRES_USER: assetguard
      ASSETGUARD_POSTGRES_PASSWORD: assetguard-ci-password
      ASSETGUARD_PUBLIC_HOST: assetguard.example.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e 'backend[dev,e2e]'
      - name: Validate Python dependencies
        run: python -m pip check
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --skip-editable
      - name: Run migrations and API tests
        working-directory: backend
        run: python -m pytest -q tests/unit tests/integration
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: backend
        env:
          ASSETGUARD_RUN_BROWSER_E2E: "1"
        run: |
          python -m pytest -q tests/e2e
      - name: Validate frontend JavaScript
        run: node --check frontend/app.js
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $failed = $true; $parseErrors | Write-Error }
          }
          if ($failed) { exit 1 }
      - name: Validate production Compose
        run: |
          docker compose -f infra/containers/docker-compose.production.yml config --quiet
          docker compose -f infra/containers/docker-compose.free-demo.yml config --quiet

  grounding-dino-smoke:
    name: Grounding DINO real-model smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: grounding-dino-tiny-${{ runner.os }}-v1
      - name: Install real Vision runtime
        run: python -m pip install -e 'backend[vision]'
      - name: Download model and analyse demo frame
        working-directory: backend
        run: python scripts/vision_real_model_smoke.py
