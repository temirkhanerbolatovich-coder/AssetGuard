services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ASSETGUARD_POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${ASSETGUARD_POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${ASSETGUARD_POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${ASSETGUARD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - assetguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  assetguard-postgres-data:

