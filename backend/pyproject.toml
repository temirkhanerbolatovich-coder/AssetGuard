[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "assetguard-backend"
version = "0.1.0"
description = "AssetGuard MVP backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "openpyxl>=3.1,<4.0",
  "pdfplumber>=0.11,<1.0",
  "reportlab>=4.0,<5.0",
  "segno>=1.6,<2.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pillow>=11.0,<13.0",
  "python-multipart>=0.0.18,<1.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

e2e = [
  "playwright>=1.55,<2.0",
]

vision = [
  "torch>=2.5,<3.0",
  "transformers>=4.48,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assetguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
